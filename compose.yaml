name: spending-mapping

services:
  mapping:
    build:
      context: .
    image: spending-mapping:local
    restart: unless-stopped
    init: true
    env_file:
      - /srv/persistent/secrets/spending/spending.env
    environment:
      EVIDENCE_DIR: /data/evidence/cmb-email
    volumes:
      - type: bind
        source: /srv/persistent/data/spending
        target: /data
